<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>마녀의 대시보드 v7.7.0 (현금·세금 정합성)</title>
<style>
/* === 기본 스타일 (13px 유지) === */
body{font-family:sans-serif; margin:10px; font-size:13px;}
table{width:100%; border-collapse:collapse; table-layout:fixed; margin-top:5px;}
th,td{border:1px solid #ccc; padding:3px 1px; text-align:center; vertical-align:middle; height: 34px;}
input,select,button{font:inherit; font-size:13px;}

/* === 입력창 스타일 === */
#grid td > input { width: 100%; padding: 2px 2px; box-sizing: border-box; text-align: right; border:none; background: transparent; height: 26px; line-height: 22px;}
#grid td > input:focus { background: #fff; outline: 2px solid #aaa; }
#grid td input.name { text-align: left; font-weight: bold; }
#grid td input.code { text-align: center; color: #666; font-size: 12px; }
#grid td input[type="date"] { font-size: 11px; text-align: center; height: 24px; padding: 0; letter-spacing: -1px; width: 100%; }

td input[readonly]{background:#f9f9f9; color:#555}
.status{font-size:12px; font-weight:bold;}
.profit-pos{color:#d32f2f; font-weight:bold}
.profit-neg{color:#1976d2; font-weight:bold}

/* === 버튼 및 액션 === */
.actions{display:inline-flex; align-items:center; gap:2px; white-space:nowrap; justify-content:center}
.mv{display:inline-flex; gap:1px}
.mv button, .del, .chart-btn, .reset-row-btn { width: 24px; height: 24px; font-size: 12px; padding: 0; cursor:pointer; border:1px solid #999; background:#eee; border-radius:3px; }
.del{ width:auto; padding:0 6px; background:#ffebee; border-color:#ef9a9a; color:#c62828; }
.reset-row-btn { width:auto; padding:0 6px; background:#e0f2f1; border-color:#80cbc4; color:#00695c; }
.chart-btn{ width:auto; padding:0 6px; background:#e3f2fd; border-color:#90caf9; color:#1565c0; }
#resetBtn { background: #333; color: #fff; border: 1px solid #000; font-weight: bold; padding: 4px 8px; font-size: 12px;}

/* === 목표가 점 === */
.dot{width:6px; height:6px; border-radius:50%; background:#ccc; display:inline-block; flex-shrink:0;}
.dot.red{background:#ff1744}
.dot.blue{background:#2979ff}
.target-cell{display:flex; align-items:center; gap:2px; justify-content:center; width:100%;}
.target-cell input { flex: 1; min-width: 0; font-size: 12px; }
/* 목표가 도달 시 점 깜빡임 (JS에서 blink-red-dot / blink-blue-dot 클래스를 붙임) */
@keyframes blinkDot { 0%,100%{opacity:1;} 50%{opacity:0.15;} }
.blink-red-dot  { animation: blinkDot 0.8s ease-in-out infinite; box-shadow:0 0 5px #ff1744; }
.blink-blue-dot { animation: blinkDot 0.8s ease-in-out infinite; box-shadow:0 0 5px #2979ff; }

/* === 상단 필터 바 === */
.filter-bar { margin: 8px 0; display:flex; gap: 6px; align-items: center; padding: 6px; background: #f4f4f4; border-radius: 6px; border: 1px solid #ddd; flex-wrap:wrap; }
.filter-label { font-weight: bold; margin-right: 4px; font-size: 13px;}
.filter-btn { padding: 5px 10px; border: 1px solid #bbb; background: #fff; cursor: pointer; border-radius: 4px; font-size: 12px;}
.filter-btn.active { background: #424242; color: #fff; border-color: #000; font-weight: bold;}

.grp-btn { width: 26px; height: 22px; font-size: 11px; font-weight:bold; border:1px solid rgba(0,0,0,0.2); border-radius: 4px; cursor:pointer; padding:0;}
.grp-short { background: #ffebee; color: #c62828; }
.grp-long  { background: #e3f2fd; color: #1565c0; }

/* === 시장 구분 토글 (코/닥/E) — 종목명 왼쪽 20px 정사각 버튼 === */
.name-cell { display:flex; align-items:center; gap:3px; width:100%; }
/* .name이 div 안으로 들어가면서 `#grid td > input` 규칙이 안 걸리므로 여기서 다시 지정 */
.name-cell .name { flex:1; min-width:0; width:100%; padding:2px; box-sizing:border-box;
                   border:none; background:transparent; height:26px; line-height:22px;
                   text-align:left; font-weight:bold; }
.name-cell .name:focus { background:#fff; outline:2px solid #aaa; }
.mk-btn { width:20px; min-width:20px; height:20px; font-size:10px; font-weight:bold; line-height:1;
          border:1px solid rgba(0,0,0,0.18); border-radius:4px; cursor:pointer; padding:0; flex-shrink:0; }
.mk-kospi  { background:#e8eaf6; color:#3949ab; }
.mk-kosdaq { background:#fff3e0; color:#ef6c00; }
.mk-etf    { background:#e0f2f1; color:#00695c; }

.status-badge { display:inline-block; padding:2px 4px; border-radius:4px; color:#fff; font-size:11px; line-height:1.2; font-weight:normal; min-width: 32px;}
.st-active { background:#00897b; }
.st-sold { background:#757575; } 
.st-watch { background:#fff; color:#999; border:1px solid #ddd; }

.top-total{position:fixed; top:50px; right:15px; z-index:6; background:#fff; border:2px solid #ccc; padding:6px 12px; border-radius:10px; box-shadow:0 4px 14px rgba(0,0,0,.1); font-weight:bold; font-size: 14px;}
.total-pos{color:#d32f2f; border-color:#ef9a9a;} 
.total-neg{color:#1976d2; border-color:#90caf9;}

td.cur-cell { position: relative; }
td.cur-cell .trend-dots { position: absolute; right: 2px; bottom: 2px; display:flex; gap:1px; pointer-events:none;} 
.trend-dot { width:5px; height:5px; border-radius:50%; background:#ddd; opacity:.5 } 
.trend-dot.up   { background:#d32f2f; opacity:1; }
.trend-dot.down { background:#1976d2; opacity:1; }

.date-cell { display:flex; flex-direction:column; align-items:center; gap:0px; }
.d-day-badge { font-size:9px; font-weight:bold; color:#fff; background:#90a4ae; padding:1px 3px; border-radius:3px; display:inline-block; min-width:24px; line-height: 1.1; margin-bottom: 1px;}
.d-day-badge.new { background: #ff9800; } 
.d-day-badge.old { background: #607d8b; } 

.row-no { cursor: pointer; position: relative; }
.row-no:hover { background-color: #e3f2fd; } 
.memo-indicator { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; background: red; border-radius: 50%; display: none;}
.row-no.has-memo .memo-indicator { display: block; }
.memo-tooltip { display: none; position: absolute; left: 100%; top: 0; z-index: 1000; background: #333; color: #fff; padding: 6px 10px; border-radius: 4px; font-size: 12px; width: 200px; text-align: left; white-space: pre-wrap; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); }
.row-no:hover .memo-tooltip { display: block; }

/* === 컬럼 폭 === */
col.col-no { width: 30px; } col.col-group { width: 35px; } col.col-status { width: 45px; } 
col.col-code { width: 55px; } col.col-name { width: 90px; } 
col.col-date { width: 78px; } col.col-sdate { width: 78px; } 
col.col-avg { width: 65px; } col.col-qty { width: 35px; } col.col-inv { width: 75px; }
col.col-target { width: 85px; }
col.col-autosell { width: 72px; }
col.col-cur { width: 70px; } col.col-rate { width: 50px; }
col.col-fix { width: 70px; } col.col-day-profit { width: 65px; } col.col-profit { width: 65px; } 
col.col-percent { width: 55px; } col.col-act { width: 190px; }

@media (max-width: 600px) {
  .actions { flex-wrap: wrap; }
  .filter-bar { flex-wrap: wrap; }
  .top-total { font-size: 12px; padding: 4px 8px; top: 45px; right: 10px; } 
}
</style>
</head>

<script>
// ==========================================
// 1. 유틸리티 및 설정
// ==========================================
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
const fmt=(n)=>(n??0).toLocaleString('ko-KR');
const toNum=(v)=>Number(String(v||'').replace(/,/g,''))||0;

// [요청 반영] 수수료
// 한국투자증권 "위탁(국내수수료우대), 미니닥스" 계좌 기준
//   유관기관제비용 0.0036396% : 매수/매도 양쪽 모두 부과 (위탁수수료는 우대로 면제)
//   증권거래세     0.15%      : 매도할 때만 부과
//   → 매수 0.0036396% / 매도 0.1536396%
const FEE_BUY=0.000036396, FEE_SELL=0.000036396, TAX_SELL=0.0015;

/* === 시장 구분 (코스피 / 코스닥 / ETF) ===
   ETF는 국내 상장분이라 매도 시 증권거래세 0.15%가 면제됨.
   코스피와 코스닥은 현재 세율이 같지만 구분 표시용으로 나눠둠. */
const MARKETS = ['kospi','kosdaq','etf'];
const MARKET_INFO = {
  kospi : { label:'코', cls:'mk-kospi',  title:'코스피 — 매도 시 증권거래세 0.15% (클릭하면 변경)' },
  kosdaq: { label:'닥', cls:'mk-kosdaq', title:'코스닥 — 매도 시 증권거래세 0.15% (클릭하면 변경)' },
  etf   : { label:'E',  cls:'mk-etf',    title:'ETF — 증권거래세 면제 (클릭하면 변경)' }
};
// 잘 알려진 ETF 브랜드. 자동 추정용이며 버튼 클릭으로 언제든 바꿀 수 있음
const ETF_BRAND = /^(KODEX|TIGER|ACE|RISE|PLUS|SOL|KOSEF|HANARO|ARIRANG|KBSTAR|TIMEFOLIO|히어로즈|마이다스)[\s_]/i;

// 저장된 market 값이 없으면 기존 종목명 규칙(_D=코스닥, _P=코스피)에서 추정
function getMarket(r){
  if (r && MARKETS.includes(r.market)) return r.market;
  const nm = (r && r.name) ? r.name : '';
  if (ETF_BRAND.test(nm)) return 'etf';
  if (/_D\b/.test(nm)) return 'kosdaq';
  return 'kospi';
}

function calcProfit(avg,cur,fix,qty,market){
  const base=(fix && fix!==0) ? fix : cur;
  if(!avg||!qty||!base) return {won:0,pct:0};
  const buyAmt=avg*qty;
  const sellAmt=base*qty;
  const tax = (market === 'etf') ? 0 : TAX_SELL;   // ETF는 증권거래세 면제
  const totalCost = (buyAmt * FEE_BUY) + (sellAmt * (FEE_SELL + tax));
  const profit = sellAmt - buyAmt - totalCost;
  return {won:profit, pct: (profit/buyAmt)*100};
}

// [핵심] 함수 정의 최상단 이동
// accumulate=true 는 render()가 전체를 다시 그릴 때만 전달한다.
// (render() 밖에서 호출될 때도 더하면 _todayProfitSum 이 중복 누적되어 당일손익이 부풀려짐)
function updateRowCalculation(tr, r, accumulate){
  r.inv = (r.avg||0) * (r.qty||0); 
  const elInv = tr.querySelector('.inv'); if(elInv) elInv.value = fmt(r.inv);
  
  const {won, pct} = calcProfit(r.avg, r.cur, r.fix, r.qty, getMarket(r));
  
  let dayProfit = 0;
  if (r._isAgg && r.dayProfit !== undefined) {
      dayProfit = r.dayProfit;
  } else {
      dayProfit = calculateDayProfitForRow(r);
  }
  if (accumulate) _todayProfitSum += dayProfit;

  const dp = tr.querySelector('.dp');
  if(dp) {
      dp.textContent = fmt(Math.round(dayProfit));
      dp.className = 'dp ' + (dayProfit >= 0 ? 'profit-pos' : 'profit-neg');
  }

  const pw = tr.querySelector('.pw'); const pp = tr.querySelector('.pp');
  if(pw) { pw.textContent = fmt(Math.round(won)); pw.className = 'pw ' + (won >= 0 ? 'profit-pos' : 'profit-neg'); }
  if(pp) { pp.textContent = pct.toFixed(2) + '%'; pp.className = 'pp ' + (pct >= 0 ? 'profit-pos' : 'profit-neg'); }
  
  if (!r.fix || r.fix == 0) {
      const utDot = tr.querySelector('.ut-dot'); const ltDot = tr.querySelector('.lt-dot');
      if(utDot) utDot.className = 'dot ut-dot' + (r.utarget > 0 && r.cur >= r.utarget ? ' red blink-red-dot' : '');
      if(ltDot) ltDot.className = 'dot lt-dot' + (r.ltarget > 0 && r.cur <= r.ltarget ? ' blue blink-blue-dot' : '');
  }

  const curTd = tr.querySelector('.cur').closest('td');
  if(r.qty > 0 && !r.fix) { 
      curTd.style.backgroundColor = '#e0f7fa'; 
      const elQty = tr.querySelector('.qty'); if(elQty) elQty.style.fontWeight = 'bold'; 
  }
  else if(r.fix > 0) { 
      curTd.style.backgroundColor = ''; 
      const elFix = tr.querySelector('.fix'); if(elFix) elFix.closest('td').style.backgroundColor = '#eee'; 
  }
  else { curTd.style.backgroundColor = ''; }
  
  updateHistoryVisuals(tr, r.code, r.cur);
}

function getDDay(dateStr) {
    if(!dateStr) return '';
    const target = new Date(dateStr); target.setHours(0,0,0,0);
    const today = new Date(); today.setHours(0,0,0,0);
    const diff = (today - target) / (1000 * 60 * 60 * 24);
    const d = Math.floor(diff);
    if(d === 0) return 'D-Day';
    if(d > 0) return 'D+'+d;
    return 'D'+d; 
}

const KEY_ROWS='rows_v5_final';
const KEY_SET ='set_v5_final';
const KEY_UNDO='undo_snapshot_v1';
let rows=[], settings={};
let currentFilter = 'short';
let _todayProfitSum = 0; // render()에서 집계한 당일 손익 합계

function saveUndoSnapshot() {
  const snapshot = {
    rows: JSON.parse(JSON.stringify(rows)),
    settings: JSON.parse(JSON.stringify(settings)),
    savedAt: new Date().toLocaleString('ko-KR')
  };
  saveJSON(KEY_UNDO, snapshot);
  const btn = $('#undoBtn');
  if (btn) { btn.style.display = 'inline-block'; btn.title = '저장 시각: ' + snapshot.savedAt; }
}

function restoreUndoSnapshot() {
  const snapshot = loadJSON(KEY_UNDO, null);
  if (!snapshot) { alert('되돌릴 데이터가 없습니다.'); return; }
  if (!confirm(`[${snapshot.savedAt}] 시점으로 되돌리시겠습니까?\n현재 데이터는 사라집니다.`)) return;
  rows = snapshot.rows.map(r => ({ ...r, group: r.group || 'short', memo: r.memo || '' }));
  settings = Object.assign(settings, snapshot.settings);
  saveRows(); saveSettings(); applySettingsToUI(); render();
  alert('되돌리기 완료!');
}

function loadJSON(k,d){ try{ return JSON.parse(localStorage.getItem(k)) ?? d; }catch{ return d; } }
function saveJSON(k,o){ localStorage.setItem(k, JSON.stringify(o)); }

function loadAll(){
  const savedRows = loadJSON(KEY_ROWS,[]);
  rows = savedRows.map(r => {
    if(typeof r !== 'object' || r === null) return { group: 'short' };
    return { ...r, group: r.group || 'short', memo: r.memo || '' }; 
  });
  
  // 최초 1회: 종목명(_D/_P/ETF 브랜드)에서 추정한 시장 구분을 실제 값으로 굳혀둔다.
  // 이렇게 해두면 나중에 종목명을 고쳐도 세금 계산이 조용히 바뀌지 않는다.
  let mkMigrated = false;
  rows.forEach(r => { if(!MARKETS.includes(r.market)) { r.market = getMarket(r); mkMigrated = true; } });
  if(mkMigrated) saveRows();

  const savedSettings = loadJSON(KEY_SET,{});
  let arch = savedSettings.archivedProfit;
  if(typeof arch !== 'number' || isNaN(arch)) arch = 0;
  let cap = savedSettings.totalCapital;
  if(typeof cap !== 'number' || isNaN(cap)) cap = 0;
  let realCash = savedSettings.realCash;
  if(typeof realCash !== 'number' || isNaN(realCash)) realCash = 0;

  settings=Object.assign({
    apiBase:'https://stock-dashboard.respite9.workers.dev',
    apiMode:'auto', pollSec:10, codeParam:'code', priceKey:'price',
    cloudUrl:'', cloudId:'',
    // 보기 설정 기본값 (새로고침해도 유지되도록 저장 대상에 포함)
    viewFilter:'short', hideSold:false, hideWatch:false, merge:false, live:true
  }, savedSettings, { archivedProfit: arch, totalCapital: cap, realCash: realCash });

  applySettingsToUI();
}

// 화면에 보이지 않게 쌓이는 시세 히스토리(hist_종목코드) 중 더 이상 없는 종목 것을 정리
function cleanupHistory(){
  const alive = new Set(rows.map(r => r.code).filter(Boolean));
  const dead = [];
  for(let i=0; i<localStorage.length; i++){
    const k = localStorage.key(i);
    if(k && k.startsWith(HIST_KEY_PREFIX) && !alive.has(k.slice(HIST_KEY_PREFIX.length))) dead.push(k);
  }
  dead.forEach(k => localStorage.removeItem(k));
  if(dead.length) console.log(`[정리] 사용하지 않는 시세 히스토리 ${dead.length}건 삭제`);
}

// 보기 설정(필터·숨김·합산·실시간)을 settings에 담는다. persist=true면 즉시 저장까지.
function saveViewSettings(persist){
  settings.viewFilter = currentFilter;
  const elHS = $('#hideSoldToggle');  if(elHS) settings.hideSold  = elHS.checked;
  const elHW = $('#hideWatchToggle'); if(elHW) settings.hideWatch = elHW.checked;
  const elMG = $('#mergeToggle');     if(elMG) settings.merge     = elMG.checked;
  const elLV = $('#liveToggle');      if(elLV) settings.live      = elLV.checked;
  if(persist !== false) saveJSON(KEY_SET, settings);
}
function saveRows(){ saveJSON(KEY_ROWS,rows); }

function calculateDayProfitForRow(r) {
  if (!r.qty || Number(r.qty) <= 0) return 0;
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');

  const isSold     = r.fix > 0;
  const boughtToday = r.date === todayStr;
  const soldToday   = r.sellDate === todayStr;

  // 매도된 종목인데 오늘 매도가 아니면 오늘 손익 없음
  if (isSold && !soldToday) return 0;

  // 오늘 매수한 종목: 매수가 기준 당일 전체 손익
  if (boughtToday) {
    const {won} = calcProfit(r.avg, r.cur, r.fix, r.qty, getMarket(r));
    return won;
  }

  // 이전 매수 + 보유 중 or 오늘 매도: 전일 종가 대비 변동분
  const curPrice = r.cur || 0;
  const rate     = r.dRate || 0;
  if (curPrice <= 0) return 0;
  const prevClose  = curPrice / (1 + rate / 100);
  const evalPrice  = isSold ? r.fix : curPrice;
  if (prevClose <= 0) return 0;
  return (evalPrice - prevClose) * r.qty;
}

function aggregateRows(originalRows) {
    const map = new Map();
    const result = [];
    const hideSold = $('#hideSoldToggle').checked;
    const hideWatch = $('#hideWatchToggle').checked; 

    originalRows.forEach((r, originalIndex) => {
        if(currentFilter === 'short' && r.group === 'long') return;
        if(currentFilter === 'long' && r.group === 'short') return;
        
        const isSold = (r.fix > 0);
        if(hideSold && isSold) return;
        const isWatch = (!r.qty || Number(r.qty) <= 0);
        if(hideWatch && isWatch) return;

        const statusKey = isSold ? 'SOLD' : 'ACTIVE';
        const key = r.code + '_' + r.group + '_' + statusKey; 
        const rowDayProfit = calculateDayProfitForRow(r);

        if (!map.has(key)) {
            map.set(key, { 
                ...r, _idx: originalIndex, _isAgg: false, _count: 1, 
                _totalQty: Number(r.qty) || 0, 
                _totalInvest: (Number(r.avg) || 0) * (Number(r.qty) || 0),
                _totalSellAmt: (Number(r.fix) || 0) * (Number(r.qty) || 0),
                _totalDayProfit: rowDayProfit
            });
        } else {
            const entry = map.get(key);
            const curQty = Number(r.qty) || 0;
            const curInvest = (Number(r.avg) || 0) * curQty;
            const curSellAmt = (Number(r.fix) || 0) * curQty;
            entry._isAgg = true; entry._count++; 
            entry._totalQty += curQty; entry._totalInvest += curInvest; entry._totalSellAmt += curSellAmt;
            entry._totalDayProfit += rowDayProfit;
            if (r.date < entry.date) entry.date = r.date;
            if (r.sellDate && (!entry.sellDate || r.sellDate > entry.sellDate)) { entry.sellDate = r.sellDate; }
        }
    });
    
    map.forEach(val => {
        if (val._isAgg) { 
            val.qty = val._totalQty; 
            val.avg = val._totalQty > 0 ? Math.round(val._totalInvest / val._totalQty) : 0; 
            if(val._totalSellAmt > 0 && val._totalQty > 0) { val.fix = Math.round(val._totalSellAmt / val._totalQty); }
            val.dayProfit = val._totalDayProfit;
            val.name = val.name + ` (합:${val._count})`; 
        }
        result.push(val);
    });
    return result.sort((a,b) => a._idx - b._idx);
}

function render(){
  const tb=$('#tbody'); if(!tb) return;
  tb.innerHTML='';
  _todayProfitSum = 0; // 렌더링 시작 시 초기화
  const useMerge = $('#mergeToggle').checked;
  let displayRows = [];
  
  if (!Array.isArray(rows)) { rows = []; }

  if (useMerge) { displayRows = aggregateRows(rows); } 
  else {
      const hideSold = $('#hideSoldToggle').checked;
      const hideWatch = $('#hideWatchToggle').checked; 
      rows.forEach((r, i) => {
          if(currentFilter === 'short' && r.group === 'long') return;
          if(currentFilter === 'long' && r.group === 'short') return;
          if(hideSold && r.fix > 0) return;
          const isWatch = (!r.qty || Number(r.qty) <= 0);
          if(hideWatch && isWatch) return;
          displayRows.push({ ...r, _idx: i, _isAgg: false });
      });
  }

  let displayIdx = 0;
  displayRows.forEach((r) => {
    displayIdx++; const realIndex = r._idx;
    const tr=document.createElement('tr'); tr.dataset.idx = realIndex;
    if(r._isAgg) tr.style.background = "#fff8e1"; 
    const isLong = r.group === 'long'; const grpClass = isLong ? 'grp-long' : 'grp-short'; const grpText = isLong ? '장' : '단';
    const mkInfo = MARKET_INFO[getMarket(r)];
    const dDayStr = getDDay(r.date); const dDayClass = (dDayStr.startsWith('D+0') || dDayStr==='D-Day') ? 'new' : 'old';
    const dDayBadge = dDayStr ? `<span class="d-day-badge ${dDayClass}">${dDayStr}</span>` : '';
    const hasMemo = r.memo && r.memo.trim().length > 0; const memoClass = hasMemo ? 'has-memo' : '';
    const memoTooltip = hasMemo ? `<div class="memo-tooltip">${r.memo}</div>` : '';
    const readOnlyAttr = r._isAgg ? 'readonly style="color:#aaa"' : '';
    const dr = r.dRate || 0; const drClass = dr > 0 ? 'profit-pos' : (dr < 0 ? 'profit-neg' : ''); const drStr = (dr > 0 ? '+' : '') + dr + '%';

    let statusHtml = '';
    const rQty = Number(r.qty) || 0;
    const rFix = Number(r.fix) || 0;
    if (rQty > 0 && rFix > 0) statusHtml = '<span class="status-badge st-sold">매도됨</span>';
    else if (rQty > 0 && !rFix) statusHtml = '<span class="status-badge st-active">운영중</span>';
    else statusHtml = '<span class="status-badge st-watch">관망</span>';

    tr.innerHTML=`
      <td class="row-no ${memoClass}" title="No">
        ${displayIdx}<span class="memo-indicator"></span>${memoTooltip}
      </td>
      <td><button class="grp-btn ${grpClass}" ${r._isAgg ? 'disabled style="opacity:0.5"' : ''}>${grpText}</button></td>
      <td>${statusHtml}</td>
      <td><input class="code" value="${r.code||''}" ${readOnlyAttr}></td>
      <td><div class="name-cell">
        <button class="mk-btn ${mkInfo.cls}" title="${mkInfo.title}" ${r._isAgg ? 'disabled style="opacity:0.5"' : ''}>${mkInfo.label}</button>
        <input class="name" value="${r.name||''}" ${readOnlyAttr}>
      </div></td>
      <td><div class="date-cell">${dDayBadge}<input type="date" class="date" value="${r.date||''}" ${readOnlyAttr}></div></td>
      <td><input type="date" class="sdate" value="${r.sellDate||''}" ${readOnlyAttr}></td>
      <td><input class="avg" value="${r.avg?fmt(r.avg):''}" ${readOnlyAttr}></td>
      <td><input class="qty" value="${r.qty||''}" ${readOnlyAttr}></td>
      <td><input class="inv" readonly value="${fmt((r.avg||0)*(r.qty||0))}"></td>
      <td><div class="target-cell"><span class="dot ut-dot"></span><input class="utarget" value="${r.utarget ? fmt(r.utarget) : ''}"></div></td>
      <td><div class="target-cell"><span class="dot lt-dot"></span><input class="ltarget" value="${r.ltarget ? fmt(r.ltarget) : ''}"></div></td>
      <td style="${r.autosell > 0 ? 'background:#fff3e0;' : ''}"><input class="autosell" value="${r.autosell ? fmt(r.autosell) : ''}" style="width:100%; padding:2px; box-sizing:border-box; text-align:right; border:none; background:transparent; font-size:12px; height:26px; color:#e65100; font-weight:${r.autosell > 0 ? 'bold' : 'normal'};"></td>
      <td class="cur-cell">
        <input class="cur" value="${r.cur?fmt(r.cur):''}" style="font-weight:bold;">
        <div class="trend-dots"></div> 
      </td>
      <td><span style="font-size:11px;" class="${drClass}">${drStr}</span></td>
      <td><input class="fix" value="${r.fix?fmt(r.fix):''}" ${readOnlyAttr}></td>
      <td><span class="dp">0</span></td>
      <td><span class="pw">0</span></td>
      <td><span class="pp">0%</span></td>
      <td>
        <span class="actions">
          <button class="chart-btn">차트</button>
          <span class="mv" style="${r._isAgg ? 'display:none' : ''}">
            <button class="up">▲</button><button class="dn">▼</button>
          </span>
          ${r._isAgg ? '<span style="font-size:11px; color:#aaa;">묶음</span>' : 
            '<button class="reset-row-btn" title="초기화">초</button><button class="del">삭제</button>'}
        </span>
      </td>`;
    tb.appendChild(tr);

    if (!r._isAgg) {
        const bindInput = (sel, key, isNum) => {
            const el = tr.querySelector(sel); if(!el) return;
            el.addEventListener('change', ()=>{
                let val = el.value; if(isNum) val = toNum(val);
                const prevFix = (key === 'fix') ? (Number(rows[realIndex].fix) || 0) : null;
                rows[realIndex][key] = val;
                saveRows();
                if (key === 'fix') {
                    if (val > 0 && prevFix === 0) {
                        // fix가 0→양수로 바뀔 때만 오늘 날짜 자동 입력
                        const today = new Date();
                        rows[realIndex].sellDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
                    }
                    moveSoldRowToBottom(realIndex);
                }
                // 값이 바뀌면 전체를 다시 그린다. 그래야 당일손익/총손익 합계가 즉시 정확해짐.
                // (change 이벤트는 입력칸에서 포커스가 빠질 때 발생하므로 커서가 튀지 않음)
                else render();
            });
            if(isNum && el.type !== 'number') el.addEventListener('blur', ()=> el.value = rows[realIndex][key] ? fmt(rows[realIndex][key]) : '');
        };
        bindInput('.code', 'code'); bindInput('.name', 'name'); bindInput('.date', 'date'); bindInput('.sdate', 'sellDate');
        bindInput('.avg', 'avg', true); bindInput('.qty', 'qty', true);
        bindInput('.cur', 'cur', true); bindInput('.fix', 'fix', true);
        bindInput('.utarget', 'utarget', true); bindInput('.ltarget', 'ltarget', true);
        bindInput('.autosell', 'autosell', true);
        tr.querySelector('.del').onclick = () => { if(confirm('삭제?')) { rows.splice(realIndex,1); saveRows(); render(); } };
        const btnUp = tr.querySelector('.up'); if(btnUp) btnUp.onclick = () => { if(realIndex>0) { [rows[realIndex-1], rows[realIndex]] = [rows[realIndex], rows[realIndex-1]]; saveRows(); render(); } };
        const btnDn = tr.querySelector('.dn'); if(btnDn) btnDn.onclick = () => { if(realIndex<rows.length-1) { [rows[realIndex+1], rows[realIndex]] = [rows[realIndex], rows[realIndex+1]]; saveRows(); render(); } };
        
        tr.querySelector('.reset-row-btn').onclick = () => {
            if(confirm('이 종목의 매매 기록을 초기화하시겠습니까?\n(매수/매도일, 가격, 수량 등이 지워집니다)')) {
                rows[realIndex].date = '';      
                rows[realIndex].sellDate = '';  
                rows[realIndex].avg = 0;        
                rows[realIndex].qty = 0;        
                rows[realIndex].fix = 0;        
                rows[realIndex].utarget = 0;    
                rows[realIndex].ltarget = 0;    
                saveRows();
                render();
            }
        };
        // 시장 구분: 코스피 → 코스닥 → ETF → 코스피 순환 (확인창 없이 바로 전환)
        tr.querySelector('.mk-btn').onclick = () => {
            const now = getMarket(rows[realIndex]);
            rows[realIndex].market = MARKETS[(MARKETS.indexOf(now) + 1) % MARKETS.length];
            saveRows(); render();
        };
        tr.querySelector('.grp-btn').onclick = () => {
            if(confirm('장투/단타 그룹을 변경하시겠습니까?')) {
                rows[realIndex].group = (rows[realIndex].group === 'short') ? 'long' : 'short'; 
                saveRows(); render(); 
            }
        };
        tr.querySelector('.row-no').addEventListener('click', (e) => {
             if(e.target.classList.contains('memo-tooltip')) return;
             const newMemo = prompt("📝 메모:", rows[realIndex].memo || "");
             if(newMemo !== null) { rows[realIndex].memo = newMemo; saveRows(); render(); }
        });
    } else {
        const bindTarget = (sel, key) => {
            const el = tr.querySelector(sel);
            el.addEventListener('change', () => { rows[realIndex][key] = toNum(el.value); saveRows(); render(); });
            el.addEventListener('blur', () => { el.value = rows[realIndex][key] ? fmt(rows[realIndex][key]) : ''; });
        };
        bindTarget('.utarget', 'utarget'); bindTarget('.ltarget', 'ltarget'); bindTarget('.autosell', 'autosell');
    }
    tr.querySelector('.chart-btn').onclick = () => showChart(r.code, r.name.replace(/\s\(합:\d+\)/, ''));
    updateRowCalculation(tr, r, true);   // render() 안에서만 당일손익을 합산
  });
  updateTotalProfit();
}

// [정렬 수정] 안전한 이동 로직
function moveSoldRowToBottom(index) {
    const target = rows[index];
    const tQty = Number(target.qty) || 0;
    const tFix = Number(target.fix) || 0;
    
    if (tQty > 0 && tFix > 0) {
        rows.splice(index, 1);
        let insertAt = rows.length; 
        for(let i=0; i < rows.length; i++){
            // 관망(qty<=0) 종목이 나오면 그 바로 위에 넣기
            if(!rows[i].qty || Number(rows[i].qty) <= 0) {
                insertAt = i;
                break;
            }
        }
        rows.splice(insertAt, 0, target);
        saveRows(); render(); 
    } else { render(); }
}

function updateTotalProfit(){
  let totalProfit = 0; let operatingProfit = 0;
  let operatingInvest = 0; let operatingAsset = 0;

  if(rows && rows.length > 0) {
      rows.forEach(r => {
        if(currentFilter === 'short' && r.group === 'long') return;
        if(currentFilter === 'long' && r.group === 'short') return;
        const {won} = calcProfit(r.avg, r.cur, r.fix, r.qty, getMarket(r));
        totalProfit += won;

        if(r.qty > 0 && !r.fix) {
            operatingProfit += won;
            operatingInvest += (r.avg || 0) * r.qty;
            operatingAsset += (r.cur || 0) * r.qty;
        }
      });
  }

  if (currentFilter !== 'short') {
      const archived = (settings && typeof settings.archivedProfit === 'number') ? settings.archivedProfit : 0;
      totalProfit += archived;
  }

  const elTotal = $('#totalProfit');
  if(elTotal) { elTotal.textContent = fmt(Math.round(totalProfit)); elTotal.className = totalProfit >= 0 ? 'profit-pos' : 'profit-neg'; }
  const elOperating = $('#operatingProfit');
  if(elOperating) { elOperating.textContent = fmt(Math.round(operatingProfit)); elOperating.className = operatingProfit >= 0 ? 'profit-pos' : 'profit-neg'; }

  // 총 투자금 (수익률/투자가능금액 계산 기준)
  const cap = (settings && typeof settings.totalCapital === 'number') ? settings.totalCapital : 0;

  // [투자 가능 금액] 총 투자금 + 실현손익(아카이브 + 매도확정) - 현재 보유 매수원가
  // 필터(단타/장투)와 무관하게 항상 전체 기준으로 계산해야 실제 현금이 맞음
  let realizedProfit = (settings && typeof settings.archivedProfit === 'number') ? settings.archivedProfit : 0;
  let heldInvest = 0;
  if(rows && rows.length > 0) {
      rows.forEach(r => {
        const qty = Number(r.qty) || 0;
        const fix = Number(r.fix) || 0;
        if (fix > 0) {
            // 매도 확정 → 실현손익
            realizedProfit += calcProfit(r.avg, r.cur, r.fix, r.qty, getMarket(r)).won;
        } else if (qty > 0) {
            // 보유 중 → 이미 나간 현금 (매수금액 + 매수 수수료)
            heldInvest += (Number(r.avg) || 0) * qty * (1 + FEE_BUY);
        }
      });
  }
  const availableCash = cap + realizedProfit - heldInvest;

  // [오차 감시] 증권사 실제 주문가능금액과 대시보드 계산값의 차이
  // 플러스면 대시보드가 실제보다 적게 잡고 있다는 뜻 → 그만큼 아카이브에 이익을 더해야 함
  const realCash = (settings && typeof settings.realCash === 'number') ? settings.realCash : 0;
  const cashGap  = realCash - availableCash;
  const gapOn    = (realCash !== 0 && cap > 0);
  const gapOk    = Math.abs(cashGap) < 1000;   // 1,000원 미만이면 수수료 반올림 수준으로 보고 정상 처리
  // 오늘 찍은 값이 아니면 그 뒤의 매매 때문에 어긋난 것일 수 있으므로 날짜를 같이 보여줌
  const _t = new Date();
  const gapDate  = settings.realCashDate || '';
  const gapStale = gapDate && gapDate !== ((_t.getMonth()+1) + '/' + _t.getDate());

  const topEl = $('#topTotal');
  if(topEl) {
    const opColor  = operatingProfit >= 0 ? '#d32f2f' : '#1976d2';
    const dayColor = _todayProfitSum >= 0 ? '#d32f2f' : '#1976d2';
    const daySign  = _todayProfitSum >= 0 ? '+' : '';
    const dayRate  = operatingInvest > 0 ? (_todayProfitSum / operatingInvest * 100).toFixed(2) : null;
    const dayRateStr = dayRate !== null ? ` (${dayRate >= 0 ? '+' : ''}${dayRate}%)` : '';
    topEl.innerHTML = `
        총: ${fmt(Math.round(totalProfit))}
        <span style="font-size:0.9em; margin-left:4px; color:${opColor}; font-weight:normal;">(운영: ${fmt(Math.round(operatingProfit))})</span>
        <span style="margin-left:8px; font-size:0.95em; color:${dayColor}; font-weight:bold;">당일: ${daySign}${fmt(Math.round(_todayProfitSum))}<span style="font-size:0.85em; font-weight:normal;">${dayRateStr}</span></span>
        <span style="margin-left:8px; font-size:0.9em; color:#555;"> | 투입: ${fmt(Math.round(operatingInvest))} | 자산: ${fmt(Math.round(operatingAsset))}</span>
        ${cap > 0 ? `<span title="지금 매수에 쓸 수 있는 현금&#10;= 총 투자금 + 실현손익(아카이브+매도확정) - 보유종목 매수금액" style="margin-left:8px; font-size:0.9em; font-weight:bold; color:${availableCash >= 0 ? '#2e7d32' : '#c62828'};">💵 매수가능 현금: ${fmt(Math.round(availableCash))}</span>` : ''}
        ${gapOn ? `<span title="${gapOk ? '실제 계좌와 일치합니다.' : `엑셀에 보정행 ${cashGap >= 0 ? '+' : ''}${fmt(Math.round(cashGap))}원을 추가한 뒤,&#10;새 합계를 🏛️ 아카이브 칸에 입력하세요.${gapStale ? '&#10;&#10;※ 오늘 찍은 값이 아닙니다. 매매가 있었다면 주문가능금액부터 갱신하세요.' : ''}`}" style="margin-left:8px; font-size:0.9em; font-weight:bold; color:${gapStale ? '#9e9e9e' : (gapOk ? '#2e7d32' : '#c62828')};">${gapOk ? '✅ 계좌와 일치' : `⚠️ 오차: ${cashGap >= 0 ? '+' : ''}${fmt(Math.round(cashGap))}`}${gapDate ? `<span style="font-weight:normal; font-size:0.85em; color:#888;"> (${gapDate}${gapStale ? ' 입력, 갱신필요' : ''})</span>` : ''}</span>` : ''}
    `;
    topEl.className = 'top-total ' + (totalProfit >= 0 ? 'total-pos' : 'total-neg');
  }
  // 총 투자금 대비 손익 뱃지
  const badge = $('#capitalProfitBadge');
  if (badge) {
    if (cap > 0) {
      const capRate = (totalProfit / cap * 100).toFixed(2);
      const capSign = totalProfit >= 0 ? '+' : '';
      const capColor = totalProfit >= 0 ? '#c62828' : '#1565c0';
      badge.textContent = `${capSign}${fmt(Math.round(totalProfit))}원 (${capSign}${capRate}%)`;
      badge.style.color = capColor;
    } else {
      badge.textContent = '';
    }
  }

  updateTodayTotals();
}

function updateTodayTotals() {
  const today = new Date();
  const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
  let shortBuy = 0, shortSell = 0, longBuy = 0, longSell = 0;
  rows.forEach(r => {
    const isShort = (r.group !== 'long');
    const qty = Number(r.qty) || 0;
    const avg = Number(r.avg) || 0;
    const fix = Number(r.fix) || 0;
    if (r.date === todayStr && qty > 0 && avg > 0) {
      if (isShort) shortBuy += avg * qty;
      else          longBuy  += avg * qty;
    }
    if (r.sellDate === todayStr && qty > 0 && fix > 0) {
      if (isShort) shortSell += fix * qty;
      else          longSell  += fix * qty;
    }
  });
  const set = (id, val) => { const el = $('#' + id); if (el) el.textContent = fmt(Math.round(val)); };
  set('todayShortBuy',  shortBuy);
  set('todayShortSell', shortSell);
  set('todayLongBuy',   longBuy);
  set('todayLongSell',  longSell);
}

async function fetchPrices(){
  if(!rows.length) return;
  // include every row that has a valid code; we want to update prices for sold long-term items as well
  const targetRows = rows.filter(r => r.code && r.code.length >= 1);
  const codes = targetRows.map(r => r.code).filter(c => c && c.length >= 6);
  if(!codes.length) { setStatus('활성 종목 없음', true); return; }
  
  const uniqueCodes = [...new Set(codes)].map(c => { let code = c.trim().toUpperCase(); if(/^\d{6}$/.test(code)) return code; return code.replace('.KS','').replace('.KQ',''); });
  const url = `${settings.apiBase}/api/prices?codes=${uniqueCodes.join(',')}&t=${Date.now()}`;
  setStatus('갱신중...', true);
  try {
    const res = await fetch(url, {cache:'no-store'}); if(!res.ok) throw new Error('HTTP '+res.status);
    const json = await res.json(); const data = json.data || [];
    const priceMap = {}; const rateMap = {};
    // ⚙️설정의 Code/Price 값을 1순위 키로 사용하고, 없으면 기존 후보들로 넘어감
    const ck = settings.codeParam || 'code';
    const pk = settings.priceKey  || 'price';
    data.forEach(d => {
      const code = d[ck] ?? d.code ?? d.cd ?? d.symbol;
      const price = d[pk] ?? d.price ?? d.nv ?? d.last;
      const rate = d.day_rate || d.rate || 0;
      if(code) { priceMap[code] = Number(price); rateMap[code] = Number(rate); }
    });
    let changed = false;
    rows.forEach(r => {
      if(!r.code) return;
      const key = r.code.replace('.KS','').replace('.KQ','');
      if(priceMap[key] !== undefined) {
        if(r.cur !== priceMap[key]) { r.cur = priceMap[key]; addSnapshot(r.code, r.cur); changed = true; }
        if(r.dRate !== rateMap[key]) { r.dRate = rateMap[key]; changed = true; }
      }
    });

    if(changed) { saveRows(); render(); }
    setStatus('OK ' + new Date().toLocaleTimeString(), true);
  } catch(e) { console.error(e); setStatus('에러: '+e.message, false); }
}

let timerId = null;
function startPolling(){
  if(timerId) clearInterval(timerId);
  const sec = Math.max(2, Number($('#pollSec').value)||10);
  timerId = setInterval(() => { if($('#liveToggle').checked) fetchPrices(); }, sec * 1000);
  if($('#liveToggle').checked) fetchPrices();
}
function setStatus(msg, isOk){ const el = $('#status'); if(el) { el.textContent = msg; el.style.color = isOk ? 'green' : 'red'; } }

const HIST_KEY_PREFIX = "hist_";
function getHistKey(code) { return HIST_KEY_PREFIX + code; }
function loadHist(code){ try{ return JSON.parse(localStorage.getItem(getHistKey(code)))||[]; }catch{return[];} }
function addSnapshot(code, price){
  const key = getHistKey(code); let hist = loadHist(code); const now = Date.now(); const last = hist[hist.length-1];
  if(!last || (now - last.t > 5*60*1000)) { hist.push({t:now, p:price}); if(hist.length > 200) hist.shift(); localStorage.setItem(key, JSON.stringify(hist)); }
}
function updateHistoryVisuals(tr, code, cur){
  if(!code || !cur) return; const hist = loadHist(code); if(!hist.length) return;
  const dotsBox = tr.querySelector('.trend-dots');
  if(dotsBox && hist.length >= 2) {
    const recent = hist.slice(-6); let dotsHtml = '';
    for(let i=1; i<recent.length; i++){ const prev = recent[i-1].p; const curr = recent[i].p; const cls = curr > prev ? 'up' : (curr < prev ? 'down' : ''); if(cls) dotsHtml += `<span class="trend-dot ${cls}"></span>`; }
    dotsBox.innerHTML = dotsHtml;
  }
}
function showChart(code, name){
  const hist = loadHist(code); if(!hist.length) { alert('히스토리 데이터가 없습니다.'); return; }
  const ctx = $('#histChart').getContext('2d'); if(window.myChart) window.myChart.destroy();
  window.myChart = new Chart(ctx, { type: 'line', data: { labels: hist.map(h => new Date(h.t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})), datasets: [{ label: name || code, data: hist.map(h => h.p), borderColor: '#ff4d4d', tension: 0.1, pointRadius: 2 }] }, options: { responsive: true, maintainAspectRatio: false } });
  $('#chartTitle').textContent = `${name} (${code})`; $('#chartModal').style.display = 'flex';
}

function downloadBackup() {
    const data = { rows: rows, settings: settings, timestamp: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `stock_dashboard_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

function restoreBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    event.target.value = ''; // 같은 파일 재선택 가능하도록 초기화
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            if (data.rows && Array.isArray(data.rows)) {
                if (confirm(`백업 파일(${data.timestamp})로 복구하시겠습니까?\n현재 데이터는 덮어씌워집니다.\n\n(직전 데이터는 [↩️ 되돌리기] 버튼으로 복원 가능합니다)`)) {
                    saveUndoSnapshot(); // 덮어쓰기 전 자동 스냅샷
                    rows = data.rows.map(r => {
                        if (typeof r !== 'object' || r === null) return { group: 'short' };
                        return { ...r, group: r.group || 'short', memo: r.memo || '' };
                    });
                    if (data.settings) {
                        settings = Object.assign(settings, data.settings);
                    }
                    saveRows();
                    saveSettings();
                    applySettingsToUI();
                    render();
                    startPolling();
                    alert('복구 완료!\n실수로 불러왔다면 [↩️ 되돌리기] 버튼을 누르세요.');
                }
            } else {
                alert('잘못된 백업 파일 형식입니다.');
            }
        } catch (err) {
            console.error(err);
            alert('파일을 읽는 중 오류가 발생했습니다.');
        }
    };
    reader.readAsText(file);
}

document.addEventListener('DOMContentLoaded', () => {

    active.sort((a,b) => calcProfit(b.avg, b.cur, b.fix, b.qty, getMarket(b)).won - calcProfit(a.avg, a.cur, a.fix, a.qty, getMarket(a)).won);

  });
  $('#btnSortName').addEventListener('click', () => {

    active.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    sold.sort((a,b) => (a.name||'').localeCompare(b.name||''));
    watch.sort((a,b) => (a.name||'').localeCompare(b.name||''));

  $('#btnSortDRate').addEventListener('click', () => {

    active.sort((a,b) => (b.dRate||0) - (a.dRate||0));
    sold.sort((a,b) => (b.dRate||0) - (a.dRate||0));
    watch.sort((a,b) => (b.dRate||0) - (a.dRate||0));
    rows = [...active, ...sold, ...watch]; saveRows(); render();
  });
  $('#btnSetTargets').addEventListener('click', () => {
    let changed = 0;

      if(r.fix > 0) return;
      if(r.qty > 0 && r.avg > 0) {

        const feeRate = FEE_BUY + FEE_SELL + (getMarket(r) === 'etf' ? 0 : TAX_SELL);

      if(r.qty>0 && r.fix>0) statusStr='매도됨';
      else if(r.qty>0 && !r.fix) statusStr='운영중';
      
      return [(r.group === 'long' ? '장투' : '단타'), statusStr, r.code||'', r.name||'', r.date||'', r.sellDate||'', r.avg||0, r.qty||0, (r.avg||0)*(r.qty||0), r.utarget||0, r.ltarget||0, r.autosell||0, r.cur||0, drStr, r.fix||0, Math.round(dayProfit), Math.round(won), (pct||0).toFixed(2)+'%', r.memo||''].join('\t');
    });
    
    const textToCopy = headers.join('\t') + '\n' + lines.join('\n');
    
    // [복사 수정] 권한 문제 시 강제 복사 시도
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textToCopy)
            .then(() => alert(`복사 완료 (${visibleRows.length}건)`))
            .catch(() => fallbackCopy(textToCopy, visibleRows.length));
    } else {
        fallbackCopy(textToCopy, visibleRows.length);
    }
  });
  
  function fallbackCopy(text, count) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
          document.execCommand('copy');
          alert(`복사 완료 (강제) (${count}건)`);
      } catch (e) {
          alert('복사 실패: ' + e);
      }
      document.body.removeChild(ta);
  }

  // 클라우드 주소는 코드에 두지 않고 ⚙️설정(브라우저 저장소)에서 읽는다.
  // 이 파일이 공개 저장소에 올라가므로 하드코딩하면 누구나 내 데이터를 읽고 덮어쓸 수 있음.
  const getCloud = () => {
      const url = (settings.cloudUrl || '').trim();
      const id  = (settings.cloudId  || '').trim();
      if(!url || !id) {
          alert('⚙️ 설정에서 [☁️ 클라우드 URL]과 [☁️ 클라우드 ID]를 먼저 입력하고 [저장]을 눌러주세요.');
          return null;
      }
      return { url, id };
  };

  $('#cloudSaveBtn').addEventListener('click', async () => {
      saveSettings();
      const c = getCloud(); if(!c) return;
      if(!confirm('클라우드에 저장?')) return;
      try {
          const res = await fetch(c.url + "?id=" + encodeURIComponent(c.id), {
              method: "POST", 
              headers: { "Content-Type": "text/plain;charset=UTF-8" }, 
              body: JSON.stringify({ rows, settings, ts: Date.now() }) 
          }); 
          if(res.ok) alert('저장 성공!'); 
          else alert('실패: ' + res.status); 
      } catch(e) { alert('에러: '+e.message); } 
  });
  
  $('#cloudLoadBtn').addEventListener('click', async () => {
      saveSettings();
      const c = getCloud(); if(!c) return;
      if(!confirm('☁️ 클라우드에서 불러오면 현재 데이터가 덮어씌워집니다.\n\n계속하시겠습니까?\n(직전 데이터는 [↩️ 되돌리기] 버튼으로 복원 가능합니다)')) return;
      saveUndoSnapshot(); // 덮어쓰기 전 자동 스냅샷
      try {
          const res = await fetch(c.url + "?id=" + encodeURIComponent(c.id));
          const json = await res.json();
          if(json.rows) {
              rows = json.rows.map(r => ({ ...r, group: r.group || 'short' }));
              saveRows();
          }
          if(json.settings) {
              // 클라우드에 저장된 옛 주소가 현재 설정을 덮어써서 접속이 끊기는 걸 막는다
              const keepUrl = settings.cloudUrl, keepId = settings.cloudId;
              settings = Object.assign(settings, json.settings, { cloudUrl: keepUrl, cloudId: keepId });
              applySettingsToUI();
              saveSettings();
          }
          render();
          alert('불러오기 완료\n실수로 불러왔다면 [↩️ 되돌리기] 버튼을 누르세요.');
      } catch(e) { alert('에러: '+e.message); }
  });

  $('#addRowBtn').addEventListener('click', () => { rows.unshift({ group: currentFilter==='long'?'long':'short' }); saveRows(); render(); });
  $('#resetBtn').addEventListener('click', () => { if(confirm('초기화?')) { rows = []; saveRows(); render(); alert('완료'); } });

  $('#saveBtn').addEventListener('click', () => { saveSettings(); startPolling(); alert('설정이 저장됐습니다.'); });
  $('#pollSec').addEventListener('change', startPolling);
  $('#undoBtn').addEventListener('click', restoreUndoSnapshot);
  $('#backupBtn').addEventListener('click', downloadBackup);
  $('#restoreBtn').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', restoreBackup);

  try {
      loadAll();
      cleanupHistory();   // 더 이상 보유/관망하지 않는 종목의 시세 히스토리 정리
      render();
      startPolling();
      // 이전 스냅샷이 있으면 되돌리기 버튼 표시
      const prevSnap = loadJSON(KEY_UNDO, null);
      if (prevSnap) {
        const btn = $('#undoBtn');
        if (btn) { btn.style.display = 'inline-block'; btn.title = '저장 시각: ' + prevSnap.savedAt; }
      }
      
      const archiveInput = $('#archivedProfitInput');
      if(archiveInput) {
          archiveInput.addEventListener('change', () => { saveSettings(); updateTotalProfit(); });
          archiveInput.addEventListener('blur', () => { archiveInput.value = fmt(toNum(archiveInput.value)); });
      }
      const capitalInput = $('#totalCapitalInput');
      if(capitalInput) {
          capitalInput.addEventListener('change', () => { saveSettings(); updateTotalProfit(); });
          capitalInput.addEventListener('blur', () => { capitalInput.value = fmt(toNum(capitalInput.value)); });
      }
      const realCashInput = $('#realCashInput');
      if(realCashInput) {
          realCashInput.addEventListener('change', () => {
              // 언제 찍은 값인지 같이 저장 → 오래된 값으로 오해하는 걸 막음
              const t = new Date();
              settings.realCashDate = (t.getMonth()+1) + '/' + t.getDate();
              saveSettings(); updateTotalProfit();
          });
          realCashInput.addEventListener('blur', () => { realCashInput.value = fmt(toNum(realCashInput.value)); });
      }
      ['#cloudUrlInput', '#cloudIdInput'].forEach(sel => {
          const el = $(sel);
          if(el) el.addEventListener('change', () => saveSettings());
      });
  } catch(e) {
      console.error("초기화 중 오류 발생:", e);
      alert("설정 로드 중 오류가 발생했습니다. '데이터 초기화' 버튼을 눌러주세요.");
  }
});
</script>
</body>
</html>
